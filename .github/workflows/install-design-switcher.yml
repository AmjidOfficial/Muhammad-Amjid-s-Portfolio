name: Install portfolio design switcher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add design assets and load them
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- AMJID-DESIGN-SWITCHER -->'
          if marker not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="designs.css" />\n  <script src="design-switcher.js" defer></script>\n  '+marker+'\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html designs.css design-switcher.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add three portfolio design switcher"
          git push
